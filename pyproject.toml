[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "market-sizing-engine"
version = "0.1.0"
description = "Reproducible South Korea synthetic-population and market-sizing engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "duckdb>=1.3,<2",
  "fastapi>=0.116,<1",
  "joblib>=1.5,<2",
  "jsonschema>=4.25,<5",
  "numpy>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "sentence-transformers>=5.1,<6",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4"]

[project.scripts]
market-engine = "market_engine.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
